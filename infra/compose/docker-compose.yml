name: factoryops

x-app-env: &app-env
  DATABASE_URL: ${DATABASE_URL}
  POSTGRES_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: 8123
  CLICKHOUSE_DB: ${CLICKHOUSE_DB}
  KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
  MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW}
  MINIO_BUCKET_EVIDENCE: ${MINIO_BUCKET_EVIDENCE}
  MINIO_BUCKET_MODELS: ${MINIO_BUCKET_MODELS}
  MINIO_BUCKET_DOCS: ${MINIO_BUCKET_DOCS}
  TEMPORAL_HOST: temporal:7233
  MQTT_HOST: mosquitto
  MQTT_PORT: 1883
  AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
  AUTH_MODE: ${AUTH_MODE:-oidc_with_demo_fallback}
  DEMO_PASSWORD: ${DEMO_PASSWORD:-demo}
  OIDC_ISSUER: ${OIDC_ISSUER}
  OIDC_AUDIENCE: ${OIDC_AUDIENCE}
  SESSION_SECRET: ${SESSION_SECRET}
  PRODUCT_NAME: ${PRODUCT_NAME:-FactoryOps}
  PRODUCT_ACCENT: ${PRODUCT_ACCENT:-#0B6E4F}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  CONNECTOR_SIM_BASE_URL: ${CONNECTOR_SIM_BASE_URL:-http://api:8000}

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [fo_net]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    volumes:
      - chdata:/var/lib/clickhouse
      - ./init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [fo_net]

  redpanda-init:
    image: redpandadata/redpanda:v24.2.4
    depends_on:
      redpanda: { condition: service_healthy }
    volumes:
      - ./redpanda-init.sh:/redpanda-init.sh:ro
    entrypoint: ["/bin/bash", "/redpanda-init.sh"]
    networks: [fo_net]

  redpanda:
    image: redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      - --advertise-kafka-addr
      - INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
      - --set
      - redpanda.auto_create_topics_enabled=true
    volumes:
      - rpdata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks: [fo_net]

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [fo_net]

  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/${MINIO_BUCKET_RAW} || true;
      mc mb -p local/${MINIO_BUCKET_EVIDENCE} || true;
      mc mb -p local/${MINIO_BUCKET_MODELS} || true;
      mc mb -p local/${MINIO_BUCKET_DOCS} || true;
      exit 0;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW}
      MINIO_BUCKET_EVIDENCE: ${MINIO_BUCKET_EVIDENCE}
      MINIO_BUCKET_MODELS: ${MINIO_BUCKET_MODELS}
      MINIO_BUCKET_DOCS: ${MINIO_BUCKET_DOCS}
    networks: [fo_net]

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    networks: [fo_net]

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./temporal-dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "tctl", "--address", "temporal:7233", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 90s
    restart: unless-stopped
    networks: [fo_net]

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      temporal: { condition: service_healthy }
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8080
    ports:
      - "18088:8080"
    restart: unless-stopped
    networks: [fo_net]

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    command: ["start-dev", "--http-port=8080", "--hostname-strict=false", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../keycloak/realm-factoryops.json:/opt/keycloak/data/import/realm-factoryops.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [fo_net]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
    networks: [fo_net]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "19090:9090"
    restart: unless-stopped
    networks: [fo_net]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3001}
    volumes:
      - grafanadata:/var/lib/grafana
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "13001:3000"
    restart: unless-stopped
    networks: [fo_net]

  api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
    ports:
      - "18000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      redpanda-init: { condition: service_completed_successfully }
      minio-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [fo_net]

  stream-worker:
    build:
      context: ../..
      dockerfile: apps/stream-worker/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      api: { condition: service_healthy }
      redpanda: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped
    networks: [fo_net]

  workflow-worker:
    build:
      context: ../..
      dockerfile: apps/workflow-worker/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [fo_net]

  agent-worker:
    build:
      context: ../..
      dockerfile: apps/agent-worker/Dockerfile
    environment:
      <<: *app-env
    depends_on:
      api: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    restart: unless-stopped
    networks: [fo_net]

  simulator:
    build:
      context: ../..
      dockerfile: apps/simulator/Dockerfile
    environment:
      <<: *app-env
      API_BASE: http://api:8000
      SIM_SEED: "42"
      SIM_ACCEL: "30"
      SIM_SCENARIOS: "midwest,lam"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [fo_net]

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-FactoryOps}
        NEXT_PUBLIC_PRODUCT_ACCENT: ${PRODUCT_ACCENT:-#0B6E4F}
        NEXT_PUBLIC_API_URL: /api
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: "3000"
      NEXT_PUBLIC_PRODUCT_NAME: ${PRODUCT_NAME:-FactoryOps}
      NEXT_PUBLIC_PRODUCT_ACCENT: ${PRODUCT_ACCENT:-#0B6E4F}
      API_INTERNAL_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [fo_net]

  traefik:
    image: traefik:v3.1.4
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:8080
      - --api.dashboard=false
    ports:
      - "18080:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [fo_net]

networks:
  fo_net:
    driver: bridge

volumes:
  pgdata:
  chdata:
  rpdata:
  miniodata:
  promdata:
  grafanadata:
