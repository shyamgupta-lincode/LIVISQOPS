http:
  routers:
    web:
      rule: PathPrefix(`/`)
      entryPoints: [web]
      service: web
      priority: 1
    api:
      rule: PathPrefix(`/api/v1`) || PathPrefix(`/health`) || PathPrefix(`/ready`) || PathPrefix(`/ws`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/metrics`)
      entryPoints: [web]
      service: api
      priority: 10
    keycloak:
      rule: PathPrefix(`/auth`)
      entryPoints: [web]
      service: keycloak
      priority: 10
  services:
    web:
      loadBalancer:
        servers:
          - url: http://web:3000
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
    keycloak:
      loadBalancer:
        servers:
          - url: http://keycloak:8080
