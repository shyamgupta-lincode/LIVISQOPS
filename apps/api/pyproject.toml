[project]
name = "factoryops-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "factoryops-config",
  "factoryops-domain",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "prometheus-client>=0.20",
  "aiokafka>=0.11",
  "minio>=7.2",
  "clickhouse-connect>=0.7",
  "uuid6>=2024.7.10",
  "orjson>=3.10",
]

[tool.uv.sources]
factoryops-config = { path = "../../packages/config", editable = true }
factoryops-domain = { path = "../../packages/domain", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factoryops_api"]
